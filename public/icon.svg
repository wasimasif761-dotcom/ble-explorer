<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ble-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5ed7" />
      <stop offset="50%" stop-color="#0a58ca" />
      <stop offset="100%" stop-color="#084298" />
    </linearGradient>
    <filter id="ble-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#ble-bg)" />

  <!-- Radio wave pulse accents -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M 120 196 A 80 80 0 0 0 120 316" />
    <path d="M 392 196 A 80 80 0 0 1 392 316" />
    <path d="M 80 156 A 140 140 0 0 0 80 356" opacity="0.2" />
    <path d="M 432 156 A 140 140 0 0 1 432 356" opacity="0.2" />
  </g>

  <!-- Bluetooth Symbol -->
  <g filter="url(#ble-glow)">
    <path 
      d="M 256 76 L 256 436 M 256 76 L 356 166 L 180 326 L 356 346 L 256 436" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Accent Nodes -->
  <circle cx="256" cy="76" r="14" fill="#ffffff" />
  <circle cx="256" cy="436" r="14" fill="#ffffff" />
  <circle cx="356" cy="166" r="14" fill="#ffffff" />
  <circle cx="180" cy="326" r="14" fill="#ffffff" />
  <circle cx="356" cy="346" r="14" fill="#ffffff" />
</svg>
